# Render Blueprint: one free Docker web service built from ./Dockerfile.
# No secret values live here: `sync: false` values are entered in the Render Dashboard when the
# Blueprint is created, and METRICS_TOKEN is generated by Render. Optional provider keys
# (GROQ_API_KEY, GOOGLE_API_KEY) are added afterwards under the service's Environment tab.
services:
  - type: web
    name: llm-api-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    # Readiness: a deploy only goes live once the database is migrated and API_KEY_PEPPER is set.
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CACHE_ENABLED
        value: "true"
      - key: API_KEY_PEPPER
        sync: false
      - key: API_KEY_SEEDS
        sync: false
      - key: METRICS_TOKEN
        generateValue: true
